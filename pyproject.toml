[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shilu-search"
version = "0.1.0"
description = "Offline Chinese chat and document search"
requires-python = ">=3.10"
dependencies = ["pypdf==6.10.0"]
license = "MIT"

[project.scripts]
shilu = "shilu.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shilu = ["web/*.html", "web/*.css", "web/*.js"]
